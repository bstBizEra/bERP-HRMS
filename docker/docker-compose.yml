# Local development stack for bERP HRMS.
#
#   cd docker && docker compose up
#
# The repository is mounted at /workspace, and init.sh installs the `berp_hrms`
# app from that mount - so this runs your code, not a fresh clone of
# frappe/hrms.
services:
  mariadb:
    image: mariadb:10.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-123}"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  frappe:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SHELL: /bin/bash
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-123}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      SITE_NAME: "${SITE_NAME:-berp.localhost}"
      FRAPPE_BRANCH: "${FRAPPE_BRANCH:-develop}"
      ERPNEXT_BRANCH: "${ERPNEXT_BRANCH:-develop}"
      PYTHON_VERSION: "${PYTHON_VERSION:-3.14}"
    working_dir: /home/frappe
    volumes:
      # The repository itself, read by init.sh when installing the app.
      - ../:/workspace:cached
      # Keeps the built bench across `docker compose down`.
      - bench-data:/home/frappe
    ports:
      - "8000:8000"
      - "9000:9000"

volumes:
  mariadb-data:
  bench-data:
