name: "Pull Request Labeler"
on:
  pull_request_target:
    types: [opened, reopened]

# The default workflow token in this repository is read-only, so the action
# fails with "Resource not accessible by integration" the first time a pull
# request actually matches a rule in .github/labeler.yml and it tries to write.
permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/labeler@v4
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
