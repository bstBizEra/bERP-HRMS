name: Patch

on:
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
      - 'crowdin.yml'
      - '.mergify.yml'
      - '**.vue'
      - '**.pot'
      - '**.po'

  workflow_dispatch:

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Patch Test

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.13
            3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: |
          pip install frappe-bench
          bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server

      - name: Run Patch Tests
        run: |
          cd ~/frappe-bench/
          bench remove-app payments --force
          bench remove-app lending --force
          jq 'del(.install_apps)' ~/frappe-bench/sites/test_site/site_config.json > tmp.json
          mv tmp.json ~/frappe-bench/sites/test_site/site_config.json

          wget https://frappe.io/files/frappe-hr-v14-p.sql.gz
          bench --site test_site --force restore ~/frappe-bench/frappe-hr-v14-p.sql.gz

          # The dump is a v14 site with UPSTREAM `hrms` installed, and this
          # repository's app is `berp_hrms`. So the historical legs run against
          # upstream hrms, and the swap to this repository happens through
          # berp_hrms.rename_migration - which is the upgrade path a real site
          # takes, and the only way this test still means anything after the
          # rename.
          git init -q apps/hrms
          git -C "apps/hrms" remote add upstream https://github.com/frappe/hrms.git
          git -C "apps/hrms" fetch -q --depth 1 upstream version-15-hotfix
          git -C "apps/hrms" checkout -q -f FETCH_HEAD
          # bench writes sites/apps.txt with no trailing newline, so appending
          # with `echo >>` joins onto the previous app's name and the bench then
          # tries to import a module called `erpnexthrms`. Rewrite the file.
          awk 'NF' sites/apps.txt | grep -vxF berp_hrms > apps.txt.new
          echo hrms >> apps.txt.new
          mv apps.txt.new sites/apps.txt
          cat sites/apps.txt

          git -C "apps/frappe" remote set-url upstream https://github.com/frappe/frappe.git
          git -C "apps/erpnext" remote set-url upstream https://github.com/frappe/erpnext.git


          function update_to_version() {
            version=$1

            branch_name="version-$version-hotfix"
            echo "Updating to v$version"

            # Fetch and checkout branches
            git -C "apps/frappe" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/erpnext" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/hrms" fetch --depth 1 upstream $branch_name:$branch_name
            git -C "apps/frappe" checkout -q -f $branch_name
            git -C "apps/erpnext" checkout -q -f $branch_name
            git -C "apps/hrms" checkout -q -f $branch_name

            # Resetup env and install apps
            pgrep honcho | xargs kill
            rm -rf ~/frappe-bench/env
            bench -v setup env --python python$2
            bench pip install -e ./apps/erpnext
            bench pip install -e ./apps/hrms
            bench start &>> ~/frappe-bench/bench_start.log &

            bench --site test_site migrate
          }

          update_to_version 15 3.13
          update_to_version 16 3.14

          echo "Swapping upstream hrms for this repository's berp_hrms"
          # Done here, on a consistent v16 stack, rather than after frappe and
          # erpnext move to develop: the site still boots as `hrms` at this
          # point, which is what the migration needs in order to read its state.
          git -C "apps/berp_hrms" checkout -q -f "$GITHUB_SHA"
          bench pip install -e ./apps/berp_hrms

          # berp_hrms joins apps.txt before the migration so bench can find the
          # command it registers; hrms stays until afterwards so the site still
          # boots as the app it currently has installed.
          awk 'NF' sites/apps.txt > apps.txt.new
          grep -qxF berp_hrms apps.txt.new || echo berp_hrms >> apps.txt.new
          mv apps.txt.new sites/apps.txt
          cat sites/apps.txt

          bench --site test_site rename-from-hrms

          awk 'NF' sites/apps.txt | grep -vxF hrms > apps.txt.new
          mv apps.txt.new sites/apps.txt
          cat sites/apps.txt
          rm -rf apps/hrms

          echo "Updating to latest version"
          # This fork's default branch is `main` and tracks upstream `develop`.
          # `upstream` here is frappe/frappe, which has no `main` branch, so
          # fetching the branch name verbatim aborts the step.
          upstream_branch="${GITHUB_BASE_REF:-${GITHUB_REF##*/}}"
          if [ "$upstream_branch" = "main" ]; then
            upstream_branch="develop"
          fi
          git -C "apps/frappe" fetch --depth 1 upstream "$upstream_branch"
          git -C "apps/frappe" checkout -q -f FETCH_HEAD
          git -C "apps/erpnext" checkout -q -f FETCH_HEAD
          git -C "apps/berp_hrms" checkout -q -f "$GITHUB_SHA"

          pgrep honcho | xargs kill
          rm -rf ~/frappe-bench/env
          bench -v setup env
          bench pip install -e ./apps/erpnext
          bench pip install -e ./apps/berp_hrms
          bench start &>> ~/frappe-bench/bench_start.log &

          bench --site test_site migrate

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cd ~/frappe-bench
          cat bench_start.log || true
          cd logs
          for f in ./*.log*; do
            echo "Printing log: $f";
            cat $f
          done